<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Crates Packer</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            width: 320px;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #1a1a1a;
            color: #e1e1e1;
            padding: 16px;
        }
        
        .container {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        
        .header {
            text-align: center;
            border-bottom: 1px solid #333;
            padding-bottom: 12px;
            margin-bottom: 8px;
        }
        
        .header h1 {
            font-size: 18px;
            color: #f74c00;
            margin-bottom: 4px;
        }
        
        .header .subtitle {
            font-size: 12px;
            color: #888;
        }
        
        .crate-info {
            background: #252525;
            border-radius: 8px;
            padding: 12px;
            border: 1px solid #333;
        }
        
        .crate-info h3 {
            color: #f74c00;
            margin-bottom: 8px;
            font-size: 14px;
        }
        
        .crate-details {
            font-size: 12px;
            line-height: 1.4;
        }
        
        .crate-details strong {
            color: #fff;
        }
        
        .btn {
            background: #f74c00;
            color: white;
            border: none;
            padding: 10px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: background 0.2s;
            text-align: center;
            width: 100%;
        }
        
        .btn:hover {
            background: #e64500;
        }
        
        .btn:active {
            background: #d43d00;
        }
        
        .btn.secondary {
            background: #333;
            color: #e1e1e1;
        }
        
        .btn.secondary:hover {
            background: #444;
        }
        
        .btn:disabled {
            background: #666;
            cursor: not-allowed;
            opacity: 0.6;
        }
        
        .button-group {
            display: flex;
            gap: 8px;
        }
        
        .settings {
            background: #252525;
            border-radius: 8px;
            padding: 12px;
            border: 1px solid #333;
        }
        
        .settings h3 {
            color: #f74c00;
            margin-bottom: 12px;
            font-size: 14px;
        }
        
        .setting-item {
            margin-bottom: 12px;
        }
        
        .setting-label {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 4px;
        }
        
        .setting-label span {
            font-size: 13px;
        }
        
        select {
            width: 100%;
            padding: 6px 8px;
            border-radius: 4px;
            border: 1px solid #444;
            background: #1a1a1a;
            color: #e1e1e1;
            font-size: 13px;
        }
        
        .status {
            font-size: 12px;
            text-align: center;
            padding: 8px;
            border-radius: 4px;
            background: #252525;
            border: 1px solid #333;
            min-height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .status.success {
            color: #4CAF50;
            border-color: #4CAF50;
        }
        
        .status.error {
            color: #f44336;
            border-color: #f44336;
        }
        
        .stats {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            color: #888;
        }
        
        .hidden {
            display: none;
        }
        
        .loader {
            border: 2px solid #333;
            border-top: 2px solid #f74c00;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🦀 Crates Packer</h1>
            <div class="subtitle">Save Rust crates to your local collection</div>
        </div>
        
        <div class="crate-info" id="currentCrateInfo">
            <h3>Current Crate</h3>
            <div class="crate-details" id="crateDetails">
                Not on a crate page. Visit crates.io/crates/* to save.
            </div>
        </div>
        
        <button class="btn" id="saveBtn" disabled>
            Save Current Crate
        </button>
        
        <div class="settings">
            <h3>Settings</h3>
            
            <div class="setting-item">
                <div class="setting-label">
                    <span>Auto-save new crates</span>
                    <label class="switch">
                        <input type="checkbox" id="autoSaveToggle">
                    </label>
                </div>
            </div>
            
            <div class="setting-item">
                <div class="setting-label">
                    <span>Export format</span>
                </div>
                <select id="formatSelect">
                    <option value="toml">TOML (Cargo.toml style)</option>
                    <option value="json">JSON</option>
                    <option value="text">Plain Text</option>
                </select>
            </div>
        </div>
        
        <div class="button-group">
            <button class="btn secondary" id="exportBtn">
                Export All
            </button>
            <button class="btn secondary" id="clearBtn">
                Clear All
            </button>
        </div>
        
        <div class="stats">
            <span>Saved: <span id="savedCount">0</span> crates</span>
            <span>Last: <span id="lastSaved">Never</span></span>
        </div>
        
        <div class="status" id="status">
            Ready
        </div>
    </div>
    
    <script src="popup.js"></script>
</body>
</html>
